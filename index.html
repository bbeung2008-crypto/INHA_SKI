ass="wrap"><div class="headrow"><h2 class="sectTitle">활동 사진</h2>${btn('전체 앨범 ＋',"go('albums')")}</div><div class="cards">${db.albums.slice().reverse().slice(0,3).map(a=>albumCard(a)).join('')||'<p>등록된 앨범이 없습니다.</p>'}</div></div></section><section class="section insta"><div class="wrap"><div class="headrow"><div><h2 class="sectTitle">FOLLOW OUR INSTAGRAM</h2><p class="muted">@inha_ski · 인하대학교 알파인 스키팀</p></div><a class="btn" target="_blank" rel="noopener" href="https://www.instagram.com/inha_ski/">Instagram 방문 ↗</a></div><div class="instagramLinkPanel"><div class="instagramMark" aria-hidden="true">◎</div><div><strong>INHA ALPINE SKI TEAM</strong><p class="muted" style="margin:2px 0 0">공식 인스타그램 @inha_ski에서 팀의 소식을 확인하세요.</p></div><a class="btn primary" href="https://www.instagram.com/inha_ski/" target="_blank" rel="noopener noreferrer">인스타그램 바로가기 ↗</a></div></div></section>`}function noticeRows(arr){return `<table class="table"><thead><tr><th>분류</th><th>제목</th><th>작성일</th></tr></thead><tbody>${arr.map(n=>`<tr class="click" onclick="go('notices',${n.id})"><td><span class="tag">${esc(n.category)}</span></td><td>${n.pin?'📌 ':''}${esc(n.title)}</td><td class="date">${esc(n.date)}</td></tr>`).join('')}</tbody></table>`}function notices(){if(sub==='new'||typeof sub==='string'&&sub.startsWith('edit:')){if(!manager())return page('접근 제한','권한이 없습니다.');let old=String(sub).startsWith('edit:')?db.notices.find(n=>n.id===Number(sub.slice(5))):null;return page(old?'공지 수정':'공지 작성',`<div class="form narrow">${textInput('제목','nt',old?.title)}<label>카테고리<select id="nc">${['공지','모집','행사'].map(x=>`<option ${old?.category===x?'selected':''}>${x}</option>`).join('')}</select></label>${textarea('본문','nb',old?.body)}<label><input type="checkbox" id="np" ${old?.pin?'checked':''}> 중요 공지 상단 고정</label>${btn('저장',`saveNotice(${old?.id||0})`,'primary')}${btn('취소',"go('notices')")}</div>`)}let n=db.notices.find(x=>x.id===Number(sub));if(n)return page('공지사항',`<div class="detail"><span class="tag">${esc(n.category)}</span><h2>${esc(n.title)}</h2><div class="muted small">${esc(n.date)} · INHA SKI 운영진</div><div class="detailBody">${esc(n.body)}</div>${manager()?`${btn('수정',`go('notices','edit:${n.id}')`)} ${btn('삭제',`delItem('notices',${n.id},'notices')`,'danger')}`:''}<hr class="hr">${btn('전체 목록으로',"go('notices')")}</div>`);let arr=[...db.notices].filter(n=>filter==='전체'||n.category===filter).sort((a,b)=>Number(b.pin)-Number(a.pin)||b.id-a.id);return page('공지사항',`<div class="headrow"><div class="tabs">${['전체','모집','행사','공지'].map(c=>`<button class="${filter===c?'on':''}" onclick="filter='${c}';render()">${c}</button>`).join('')}</div>${manager()?btn('＋ 글쓰기',"go('notices','new')",'primary'):''}</div>${noticeRows(arr)}`, 'INHA SKI의 새로운 소식과 모집·행사 안내')}
function saveNotice(id){let title=formValue('nt'),body=formValue('nb');if(!title||!body)return toast('제목과 본문을 입력하세요');let x={id:id||Date.now(),title,body,category:formValue('nc'),pin:document.getElementById('np').checked,date:new Date().toISOString().slice(0,10)};if(id)db.notices=db.notices.map(n=>n.id===id?x:n);else db.notices.push(x);save();go('notices',x.id);toast('이 브라우저의 시안에 저장되었습니다')}function albumCard(a){return `<div class="card" onclick="go('albums',${a.id})"><div class="thumb">${a.images?.[0]?`<img src="${a.images[0]}">`:'▧'}</div><div class="cardbody"><span class="tag">${esc(a.category)}</span><strong>${esc(a.title)}</strong><span class="date">${esc(a.date)} · 사진 ${(a.images||[]).length}장</span></div></div>`}function albums(){if(sub==='new'||String(sub).startsWith('edit:')){if(!manager())return page('접근 제한','권한이 없습니다.');let old=String(sub).startsWith('edit:')?db.albums.find(x=>x.id===Number(sub.slice(5))):null;return page(old?'앨범 수정':'새 앨범 작성',`<div class="form narrow">${textInput('앨범 제목','at',old?.title)}<label>분류<select id="ac"><option ${old?.category==='시즌'?'selected':''}>시즌</option><option ${old?.category==='비시즌'?'selected':''}>비시즌</option></select></label>${textarea('본문 (블로그처럼 자유롭게 작성)','ab',old?.body)}<label>사진 여러 장 선택<input class="field" type="file" id="af" accept="image/*" multiple></label><div class="notice">사진은 시안용으로 이 브라우저에 저장됩니다. 많은 원본 사진을 장기간 보관하려면 실제 서버 저장소 연동이 필요합니다.</div>${btn('저장',`saveAlbum(${old?.id||0})`,'primary')}</div>`)}let a=db.albums.find(x=>x.id===Number(sub));if(a)return page('활동 사진',`<div class="detail"><span class="tag">${esc(a.category)}</span><h2>${esc(a.title)}</h2><div class="date">${esc(a.date)}</div><div class="detailBody">${esc(a.body)}</div><div class="gallery">${(a.images||[]).map(img=>`<img src="${img}" onclick="window.open(this.src)">`).join('')}</div><div class="spaced">${manager()?`${btn('수정',`go('albums','edit:${a.id}')`)} ${btn('삭제',`delItem('albums',${a.id},'albums')`,'danger')}`:''} ${btn('목록으로',"go('albums')")}</div></div>`);return page('활동 사진',`<div class="headrow"><div class="tabs">${['전체','시즌','비시즌'].map(c=>`<button class="${filter===c?'on':''}" onclick="filter='${c}';render()">${c}</button>`).join('')}</div>${manager()?btn('＋ 앨범 작성',"go('albums','new')",'primary'):''}</div><div class="cards">${db.albums.filter(a=>filter==='전체'||a.category===filter).slice().reverse().map(albumCard).join('')||'등록된 앨범이 없습니다.'}</div>`,'활동 사진과 글을 함께 담는 블로그형 앨범 게시판')}function filesAsData(files){return Promise.all([...files].slice(0,10).map(f=>new Promise(resolve=>{if(f.size>2e6)return resolve(null);let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>resolve(null);r.readAsDataURL(f)})))}async function saveAlbum(id){let title=formValue('at');if(!title)return toast('제목을 입력하세요');let old=db.albums.find(a=>a.id===id);let images=(old?.images||[]).concat((await filesAsData(document.getElementById('af').files)).filter(Boolean));let a={id:id||Date.now(),title,category:formValue('ac'),body:formValue('ab'),images,date:new Date().toISOString().slice(0,10)};if(id)db.albums=db.albums.map(x=>x.id===id?a:x);else db.albums.push(a);try{save();go('albums',a.id)}catch{toast('브라우저 저장 공간이 부족합니다. 사진 수나 크기를 줄여주세요')}}
function intro(){if(sub==='edit'&&manager())return page('팀 소개 수정',`<div class="form narrow">${textarea('팀 소개 문구','it',db.intro)}${textarea('주요 활동','ia',db.activities)}${btn('수정 반영',"saveIntro()",'primary')}</div>`);return page('팀 소개',`<div class="two"><div><h2>INHA ALPINE SKI TEAM</h2><p class="muted">인하대학교 알파인 스키팀 · SINCE 1992</p><p>${esc(db.intro)}</p><h3>주요 활동</h3><p>${esc(db.activities)}</p><p><a href="https://www.instagram.com/inha_ski/" target="_blank">공식 인스타그램 @inha_ski ↗</a></p>${manager()?btn('✎ 팀 소개 수정',"go('intro','edit')") :''}</div><div class="thumb" style="height:260px">${db.introImage?`<img src="${db.introImage}">`:'⛷'}</div></div><hr class="hr"><div class="headrow"><h2>수상 실적</h2>${btn('전체 수상 실적 →',"go('awards')")}</div>${db.awards.slice(-3).reverse().map(a=>`<div class="noticeItem" onclick="go('awards',${a.id})"><span class="tag">${esc(a.year)}</span><strong>${esc(a.title)}</strong><span>${esc(a.result)}</span></div>`).join('')||'<p class="muted">등록된 수상 실적이 없습니다.</p>'}`,'우리 팀의 역사와 활동, 대회 기록')}
function awards(){if(sub==='new'&&manager())return page('수상 실적 등록',`<div class="form narrow">${textInput('연도','wy',new Date().getFullYear())}${textInput('대회명','wt')}${textInput('수상 결과','wr')}${textInput('선수명','wp')}${textarea('상세 내용','wb')}${btn('등록',"saveAward()",'primary')}</div>`);let a=db.awards.find(x=>x.id===Number(sub));if(a)return page('수상 실적',`<h2>${esc(a.title)}</h2><p>${esc(a.year)} · ${esc(a.result)} · ${esc(a.person)}</p><div class="detailBody">${esc(a.body)}</div>${manager()?btn('삭제',`delItem('awards',${a.id},'awards')`,'danger'):''} ${btn('목록',"go('awards')")}`);return page('수상 실적',`${manager()?btn('＋ 수상 실적 등록',"go('awards','new')",'primary'):''}<table class="table"><thead><tr><th>연도</th><th>대회명</th><th>수상 결과</th></tr></thead><tbody>${db.awards.slice().reverse().map(a=>`<tr class="click" onclick="go('awards',${a.id})"><td>${esc(a.year)}</td><td>${esc(a.title)}</td><td>${esc(a.result)}</td></tr>`).join('')}</tbody></table>`)}function saveAward(){if(!formValue('wt'))return toast('대회명을 입력하세요');db.awards.push({id:Date.now(),year:formValue('wy'),title:formValue('wt'),result:formValue('wr'),person:formValue('wp'),body:formValue('wb')});save();go('awards')}
function login(){return page('로그인',`<div class="auth form"><h2>INHA SKI MEMBER</h2>${textInput('이메일','email','','email')}${textInput('비밀번호','password','','password')}${btn('로그인',"doLogin()",'primary')}${btn('회원가입',"go('signup')")}<div class="notice">이 파일은 화면 검토용입니다. 실제 계정 인증·비밀번호 재설정은 연결되어 있지 않습니다. 데모 계정은 회원가입 후 이 브라우저에서만 사용할 수 있습니다.</div></div>`)}function signup(){return page('회원가입',`<div class="auth form"><p class="muted">가입 후 주장·부주장의 승인을 받아야 회원 전용 메뉴를 이용할 수 있습니다.</p><div class="formgrid">${textInput('이름','sn')}${textInput('학번','sid')}${textInput('나이','sage','','number')}${textInput('학과','sdept')}${textInput('기수','sgen','','number')}${textInput('전화번호','sphone')}</div>${textInput('이메일','semail','','email')}${textInput('비밀번호','spass','','password')}${textInput('비밀번호 확인','spass2','','password')}<label>회원 구분<select id="stype"><option>신입생</option><option>재학생</option></select></label><label>스키 수준<select id="slevel">${['타본 적 없음','중급','Level 1','Level 2','Level 3'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>보유 장비</label><div class="equipment">${GEAR.map((g,i)=>`<label><input type="checkbox" name="gear" value="${g}">${g}</label>`).join('')}</div>${btn('가입 신청',"doSignup()",'primary')}</div>`)}function doSignup(){let fields=['sn','sid','sage','sdept','sgen','sphone','semail','spass'];if(fields.some(x=>!formValue(x)))return toast('필수 항목을 모두 입력하세요');if(formValue('spass')!==formValue('spass2'))return toast('비밀번호가 일치하지 않습니다');if(db.members.some(m=>m.email===formValue('semail')))return toast('이미 가입한 이메일입니다');let m={id:Date.now(),name:formValue('sn'),student:formValue('sid'),age:formValue('sage'),dept:formValue('sdept'),gen:formValue('sgen'),phone:formValue('sphone'),email:formValue('semail'),password:formValue('spass'),type:formValue('stype'),level:formValue('slevel'),gear:[...document.querySelectorAll('[name=gear]:checked')].map(x=>x.value),role:'member',status:'pending'};db.members.push(m);save();go('login');toast('가입 신청이 접수되었습니다. 운영진 승인 후 이용할 수 있습니다')}function doLogin(){let m=db.members.find(m=>m.email===formValue('email')&&m.password===formValue('password'));if(!m)return toast('이메일 또는 비밀번호를 확인하세요');if(m.status!=='approved')return toast(m.status==='pending'?'운영진 승인 대기 중입니다':'가입이 승인되지 않았습니다');current=m.id;go('members');toast('로그인되었습니다')}function logout(){current=null;go('home')}
function requireMember(){return logged()?'':page('회원 전용','승인된 회원만 이용할 수 있습니다. '+btn('로그인',"go('login')"))}function members(){if(!logged())return requireMember();let arr=[...db.members].filter(m=>m.status==='approved').sort((a,b)=>Number(b.gen)-Number(a.gen));let m=arr.find(x=>x.id===Number(sub));if(m)return page('회원 상세 정보',`<div class="panel"><div class="headrow"><h2>${esc(m.name)} · ${esc(m.gen)}기</h2>${badge(m)}</div><p>학과: ${esc(m.dept)} / 나이: ${esc(m.age)} / 구분: ${esc(m.type)}</p><p>스키 수준: ${esc(m.level)} · 직책: ${esc(roleLabel(m))}</p><h3>장비 보유 현황</h3>${equipmentCount(m)===8?'<span class="badge green">모두 보유</span>':`<p>부족한 장비: ${GEAR.filter(g=>!(m.gear||[]).includes(g)).map(g=>`<span class="badge red">${g}</span>`).join(' ')}</p>`}${(manager()||m.id===current)?`<p class="muted small">학번: ${esc(m.student)} / 전화번호: ${esc(m.phone)} / 이메일: ${esc(m.email)}</p>`:''}</div>${btn('회원 목록',"go('members')")}`);return page('회원 목록',`<div class="formgrid"><input id="memberQuery" class="field" placeholder="이름·학과·스키 수준 검색" oninput="searchMembers()"><select id="memberGear" class="field" onchange="searchMembers()"><option value="">장비 전체</option>${GEAR.map(g=>`<option value="${g}">${g} 미보유</option>`).join('')}</select></div><div id="memberResults">${memberCards(arr)}</div>`,'기수별 회원 현황과 장비 보유 상태')}function roleLabel(m){return m.role==='captain'?'주장':m.role==='vice'?'부주장':m.role==='trainer'?'훈련부장':db.nextCaptain===m.id?'차기 주장':db.nextVice===m.id?'차기 부주장':'일반 회원'}function memberCards(arr){return arr.map(m=>`<div class="item flex space click" onclick="go('members',${m.id})"><div><strong>${esc(m.name)} · ${esc(m.gen)}기</strong><div class="muted small">${esc(m.dept)} · ${esc(m.level)} · ${esc(roleLabel(m))}</div></div>${badge(m)}</div>`).join('')||'<p>검색 결과가 없습니다.</p>'}function searchMembers(){let q=formValue('memberQuery').toLowerCase(),g=formValue('memberGear');let arr=db.members.filter(m=>m.status==='approved'&&`${m.name} ${m.dept} ${m.level} ${m.gen}`.toLowerCase().includes(q)&&(!g|| function approve(id,status){let m=db.members.find(m=>m.id===id);m.status=status;save();render();toast(status==='approved'?'회원이 승인되었습니다':'회원 가입이 거절되었습니다')}function changeRole(id){let m=db.members.find(m=>m.id===id),r=formValue('role'+id);if(r==='captain'&&m.role!=='captain')return toast('주장 인계는 현재 주장의 인수인계 메뉴에서만 가능합니다');if(m.role==='captain'&&r!=='captain')return toast('주장 직책 해제는 인수인계 메뉴에서만 가능합니다');m.role=r;save();render();toast('직책이 변경되었습니다')}function saveIntro(){db.intro=formValue('it');db.activities=formValue('ia');save();go('intro');toast('팀 소개가 변경되었습니다')}async function changeImage(){let target=formValue('imgtarget'),files=document.getElementById('imgfile').files;if(!files.length)return toast('사진을 선택하세요');let data=(await filesAsData(files)).filter(Boolean);if(!data.length)return toast('사진 크기가 큽니다. 2MB 이하 파일을 선택하세요');db[target]=data[0];try{save();go('home');toast('사진이 반영되었습니다')}catch{toast('브라우저 저장 공간이 부족합니다')}}function resetHero(){db.hero='';save();go('home')}
function handover(){if(!captain())return page('접근 제한','인수인계 메뉴는 현재 주장만 이용할 수 있습니다.');let approved=db.members.filter(m=>m.status==='approved');let options=(selected,exclude)=>`<option value="">지정하지 않음</option>${approved.filter(m=>m.id!==exclude).map(m=>`<option value="${m.id}" ${selected===m.id?'selected':''}>${esc(m.name)} · ${esc(m.gen)}기</option>`).join('')}`;return page('인수인계 센터',`<div class="tabs"><button class="${filter==='전체'?'on':''}" onclick="filter='전체';render()">운영 설명서</button><button class="${filter==='지정'?'on':''}" onclick="filter='지정';render()">차기 운영진 지정</button><button class="${filter==='기록'?'on':''}" onclick="filter='기록';render()">인계 기록</button></div>${filter==='전체'?`<p class="muted">새 운영진이 알아야 할 홈페이지 사용 방법</p>${db.manual.map((m,i)=>`<details class="item"><summary style="cursor:pointer;font-weight:bold">${esc(m.title)}</summary><p>${esc(m.body)}</p></details>`).join('')}<h3>인수인계 체크리스트</h3><div class="checklist">${['회원 승인 대기 현황 확인','장부 및 예산안 확인','시즌 일정 확인','차기 주장·부주장 지정','권한 인계 기록 확인'].map(s=>`<label><input type="checkbox"> ${s}</label>`).join('')}</div>`:filter==='지정'?`<div class="form narrow"><h2>현재 주장: ${esc(user().name)}</h2><label>차기 주장<select id="nextcap">${options(db.nextCaptain,db.nextVice)}</select></label><label>차기 부주장<select id="nextvice">${options(db.nextVice,db.nextCaptain)}</select></label>${btn('차기 운영진 지정 저장',"designate()",'primary')}<div class="box"><p>차기 주장: ${esc(db.members.find(m=>m.id===db.nextCaptain)?.name||'미지정')}</p><p>차기 부주장: ${esc(db.members.find(m=>m.id===db.nextVice)?.name||'미지정')}</p><p class="small muted">지정만으로는 관리자 권한이 생기지 않습니다.</p></div>${btn('최종 운영 권한 인계',"transfer()",'danger')}</div>`:`<h2>인계 기록</h2>${db.handoverHistory.slice().reverse().map(h=>`<div class="item">${esc(h.date)} · ${esc(h.from)} → ${esc(h.to)} (부주장: ${esc(h.vice)})</div>`).join('')||'<p class="muted">인계 기록이 없습니다.</p>'}`}`)}function designate(){let a=Number(formValue('nextcap'))||'',b=Number(formValue('nextvice'))||'';if(a&&a===b)return toast('같은 사람을 중복 지정할 수 없습니다');db.nextCaptain=a;db.nextVice=b;save();render();toast('차기 운영진 표시가 반영되었습니다')}function transfer(){if(!db.nextCaptain||!db.nextVice)return toast('차기 주장과 부주장을 모두 지정하세요');if(!confirm('차기 운영진에게 실제 운영 권한을 넘기시겠습니까? 이 시안에서는 즉시 반영됩니다.'))return;let a=db.members.find(m=>m.id===db.nextCaptain),b=db.members.find(m=>m.id===db.nextVice);if(!a||!b||a.id===b.id)return toast('지정 정보를 확인하세요');let from=user().name;db.members.forEach(m=>{if(['captain','vice'].includes(m.role))m.role='member'});a.role='captain';b.role='vice';db.handoverHistory.push({date:new Date().toISOString().slice(0,10),from,to:a.name,vice:b.name});db.nextCaptain='';db.nextVice='';save();go('members');toast('운영진 인계가 완료되었습니다')}
function delItem(collection,id,destination){if(!manager()&&collection!=='posts')return;if(!confirm('삭제하시겠습니까?'))return;db[collection]=db[collection].filter(x=>x.id!==id);save();go(destination);toast('삭제되었습니다')}
function openSearch(){searchOpen=true;document.getElementById('searchRoot').innerHTML=`<div class="searchOverlay" onclick="if(event.target===this)closeSearch()"><div class="searchModal"><div class="headrow"><h2>⌕ 통합 검색</h2>${btn('닫기',"closeSearch()")}</div><input class="field" id="globalQuery" placeholder="회원 이름, 공지, 행사, 글, 영상 검색" oninput="runSearch()" autofocus><div id="searchResults" class="spaced"></div></div></div>`;document.getElementById('globalQuery').focus();runSearch()}function closeSearch(){searchOpen=false;document.getElementById('searchRoot').innerHTML=''}function runSearch(){let q=formValue('globalQuery').toLowerCase(),results=[];if(!q){document.getElementById('searchResults').innerHTML='<p class="muted">검색어를 입력하세요.</p>';return}let add=(type,title,desc,route,id)=>{if(`${title} ${desc}`.toLowerCase().includes(q))results.push({type,title,desc,route,id})};db.notices.forEach(n=>add('공지사항',n.title,n.body,'notices',n.id));db.albums.forEach(a=>add('활동 사진',a.title,a.body,'albums',a.id));db.awards.forEach(a=>add('수상 실적',a.title,a.person+' '+a.result,'awards',a.id));if(logged()){db.members.filter(m=>m.status==='approved').forEach(m=>add('회원',m.name,m.gen+'기 '+m.dept+' '+m.level,'members',m.id));db.events.forEach(e=>{let attendees=Object.entries(e.responses).map(([id,r])=>db.members.find(m=>m.id===Number(id))?.name+' '+r.status).join(' ');add('행사',e.title,e.place+' '+attendees,'events',e.id)});db.posts.forEach(p=>{let author=db.members.find(m=>m.id===p.author)?.name||'';add(p.type==='sns'?'회원 SNS':'피드백',p.title,p.body+' '+author+' '+(p.comments||[]).map(c=>db.members.find(m=>m.id===c.author)?.name+' '+c.text).join(' '),p.type,p.id)});db.videos.forEach(v=>add('교육 영상',v.title,v.category+' '+v.body,'videos',v.id));if(captain())db.manual.forEach(m=>add('운영 설명서',m.title,m.body,'handover',null));if(manager())db.ledger.forEach(l=>add('회계',l.title,l.body,'ledger',null))}document.getElementById('searchResults').innerHTML=results.slice(0,60).map(r=>`<div class="item click" onclick="closeSearch();go('${r.route}',${r.id===null?'null':r.id})"><span class="tag">${esc(r.type)}</span> <strong>${esc(r.title)}</strong><div class="small muted">${esc(r.desc).slice(0,140)}</div></div>`).join('')||'<p class="muted">검색 결과가 없습니다.</p>'}
// 시안 검토용 데모 계정: 실제 서비스의 인증·관리자 권한과 무관합니다.
function createDemo(){if(db.members.some(m=>m.email==='captain@demo.invalid')){let m=db.members.find(m=>m.email==='captain@demo.invalid');current=m.id;m.status='approved';m.role='captain';save();go('members');return}let m={id:Date.now(),name:'운영진 데모',student:'DEMO',age:'23',dept:'기계공학과',gen:'35',phone:'',email:'captain@demo.invalid',password:'demo',type:'재학생',level:'중급',gear:['헬멧','고글'],role:'captain',status:'approved'};db.members.push(m);current=m.id;save();go('members');toast('시안 검토용 주장 계정으로 전환되었습니다')}

window.addEventListener('keydown',e=>{if(e.key==='Escape'&&searchOpen)closeSearch()});render();
</script><aside style="position:fixed;right:12px;bottom:12px;z-index:25"><button class="btn" style="background:#fff;box-shadow:0 3px 18px #152c4a22;font-size:12px" onclick="createDemo()">🔧 주장 데모로 체험</button></aside></body></html>
